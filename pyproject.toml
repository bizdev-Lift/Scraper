[project]
name = "llmdataextraction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "black>=25.1.0",
    "clear-html>=0.4.1",
    "fake-useragent>=2.2.0",
    "google-genai>=1.12.1",
    "gspread>=6.2.0",
    "oauth2client>=4.1.3",
    "pandas>=2.3.0",
    "playwright==1.52.0",
    "requests>=2.32.0",
    "tldextract>=5.3.0",
    "yarl>=1.20.1",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.116.1",
    "flake8>=7.1.1",
    "ipykernel>=6.29.5",
    "pre-commit>=4.0.0",
    "ruff>=0.11.7",
    "uvicorn>=0.35.0",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
